---
# Add an OS family here (and a matching block in repository.yml) to support it.
- name: Check that the operating system is supported
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: >-
      The docker role supports Debian-family (Ubuntu, Debian) and RedHat-family
      (Oracle Linux, RHEL, Rocky, Alma 8+) systems; this host is
      {{ ansible_facts.distribution }} ({{ ansible_facts.os_family }}).
    quiet: true

- name: Configure the Docker package repository
  ansible.builtin.import_tasks: repository.yml

- name: Install and start Docker
  ansible.builtin.import_tasks: install.yml

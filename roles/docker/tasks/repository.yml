---
# Official Docker CE repository, per https://docs.docker.com/engine/install/ubuntu/
# and https://docs.docker.com/engine/install/rhel/
- name: Configure the Docker apt repository
  when: ansible_facts.os_family == 'Debian'
  block:
    - name: Remove distribution packages that conflict with Docker CE
      ansible.builtin.apt:
        name: "{{ docker_conflicting_packages }}"
        state: absent

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian  # required by deb822_repository
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: "{{ docker_repo_channel }}"
        architectures: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_facts.architecture] | default(ansible_facts.architecture) }}"
        signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
        state: present
      register: docker_apt_repository

    # Inline, not a handler: install.yml needs the fresh cache in this same run.
    - name: Refresh the apt cache after adding the repository  # noqa: no-handler
      ansible.builtin.apt:
        update_cache: true
      when: docker_apt_repository is changed

# Oracle Linux, RHEL, Rocky and Alma use Docker's RHEL repository.
- name: Configure the Docker yum repository
  when: ansible_facts.os_family == 'RedHat'
  block:
    - name: Remove distribution packages that conflict with Docker CE
      ansible.builtin.package:
        name: "{{ docker_conflicting_packages_redhat }}"
        state: absent

    - name: Add the Docker yum repository
      ansible.builtin.yum_repository:
        name: docker-ce-{{ docker_repo_channel }}
        description: Docker CE {{ docker_repo_channel }}
        baseurl: "https://download.docker.com/linux/rhel/{{ ansible_facts.distribution_major_version }}/$basearch/{{ docker_repo_channel }}"
        gpgcheck: true
        gpgkey: "https://download.docker.com/linux/rhel/gpg"
        enabled: true

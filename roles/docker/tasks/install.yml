---
- name: Install Docker Engine
  ansible.builtin.package:
    name: "{{ docker_packages + ([docker_compose_package] if docker_install_compose_plugin | bool else []) }}"
    state: present

- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_daemon_options | length > 0

- name: Write /etc/docker/daemon.json
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  when: docker_daemon_options | length > 0
  notify: Restart docker

- name: Start Docker and set its boot state
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: "{{ docker_service_enabled | bool }}"
  when: docker_manage_service | bool

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  register: docker_group_membership

# Group membership only applies to new SSH sessions. This must run inline (not
# as a handler) so later roles in the same play already see the new group.
- name: Reset the SSH connection so new group membership applies  # noqa: no-handler
  ansible.builtin.meta: reset_connection
  when: docker_group_membership is changed

- name: Apply pending Docker restarts before other roles use Docker
  ansible.builtin.meta: flush_handlers

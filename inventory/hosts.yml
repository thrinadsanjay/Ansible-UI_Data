---
# Static inventory. The OCI application server is added at run time by the
# oci_compute role (ansible.builtin.add_host), so app_server starts empty.
#
# To manage an existing server without OCI discovery, list it here instead:
#   app_server:
#     hosts:
#       finance-tracker-app:
#         ansible_host: 203.0.113.10
all:
  hosts:
    localhost:
      ansible_connection: local
      # Use the controller Python that has the OCI SDK installed.
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    app_server:
      hosts: {}

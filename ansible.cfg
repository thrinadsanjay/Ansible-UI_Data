# Project-level Ansible configuration.
# Run every command from this directory so Ansible picks this file up.

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml

# Host key checking stays ON. New OCI hosts are trusted on first use through
# "-o StrictHostKeyChecking=accept-new", which the oci_compute role sets on the
# host it adds (oci_compute_ssh_common_args). A changed key still fails loudly.
host_key_checking = True

[ssh_connection]
pipelining = True

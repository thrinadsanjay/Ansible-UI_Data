---
# Deploys Finance Tracker with Docker Compose. Needs the Vault password.
#
#   ansible-playbook playbooks/03_deploy_fintracker.yml --ask-vault-pass

- name: Locate the application server
  ansible.builtin.import_playbook: discover_app_server.yml

- name: Deploy Finance Tracker
  hosts: app_server
  become: true

  roles:
    - fintracker_app

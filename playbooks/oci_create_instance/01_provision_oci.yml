---
# Provisions the OCI network, the application VM and the Load Balancer, and
# adds the VM to the in-memory "app_server" group (oci_compute / add_host).
#
#   ansible-playbook playbooks/01_provision_oci.yml

- name: Provision OCI infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  # oracle.oci reads credentials from ~/.oci/config; these select the profile and region.
  environment:
    OCI_CONFIG_PROFILE: "{{ oci_config_profile }}"
    OCI_REGION: "{{ oci_region }}"

  pre_tasks:
    # Each role validates its own inputs; this catches every leftover
    # placeholder before the first OCI API call.
    - name: Fail early if group_vars still contain placeholders
      ansible.builtin.assert:
        that:
          - oci_placeholders | length == 0
        fail_msg: "Replace REPLACE_ME in inventory/group_vars/all.yml for: {{ oci_placeholders | join(', ') }}"
        quiet: true
      vars:
        oci_required_inputs:
          - oci_compartment_id
          - oci_availability_domain
          - oci_compute_image_id
          - oci_admin_cidr
          - oci_lb_certificate_ocid
          - oci_compute_server_name
        oci_placeholders: >-
          {{ oci_required_inputs | zip(query('ansible.builtin.vars', *oci_required_inputs))
             | selectattr('1', 'search', 'REPLACE_ME') | map('first') | list }}

  roles:
    - oci_network
    - oci_compute
    - oci_load_balancer

  post_tasks:
    - name: Show the provisioned endpoints
      ansible.builtin.debug:
        msg:
          - "Load Balancer public IP: {{ oci_load_balancer_public_ip }}"
          - "App server {{ oci_compute_server_name }}: private {{ oci_compute_private_ip }}, public {{ oci_compute_public_ip | default('none', true) }}"
